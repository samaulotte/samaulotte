name: Update contribution calendar

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/update_contributions.py', 'tests/test_contributions.py', 'fonts/**', '.github/workflows/update-contributions.yml']
  pull_request:
    paths: ['scripts/update_contributions.py', 'tests/test_contributions.py', 'fonts/**', 'contributions/**', '.github/workflows/update-contributions.yml']

permissions:
  contents: read

concurrency:
  group: contribution-calendar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests
      - name: Verify public calendar retrieval and SVG generation
        run: python3 scripts/update_contributions.py

  refresh:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/update_contributions.py
      - name: Commit the public calendar snapshot
        run: |
          git add contributions/
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh public contribution calendar'
          git push
